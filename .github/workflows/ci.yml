name: CI

on:
  push:
    branches:
      - main
    tags:
      # Both stable (vX.Y.Z) and preview (vX.Y.Z-preview.N) tags trigger this workflow;
      # job-level if-conditions decide which job actually runs.
      - 'v*'
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

# Cancels an already running workflow on a new push to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions; only read access is needed.
# Publishing jobs opt into id-token: write at the job level.
permissions:
  contents: read

jobs:
  # Full CI: build + test on main pushes and pull requests. Not run on tags.
  build:
    name: Build
    if: github.event_name == 'pull_request' || github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full Git history is required for correct GitVersion version calculation.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          configFilePath: GitVersion.yml

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      #- name: Verify formatting
      #  run: dotnet format --verify-no-changes --no-restore

  test:
    name: Test
    needs: build
    if: github.event_name == 'pull_request' || github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration ${{ env.CONFIGURATION }} --no-restore --verbosity normal

  # Slim publish: build + pack + push for preview tags (vX.Y.Z-preview.N).
  # Tests for this commit have already been run by CI on main.
  publish-preview:
    name: Publish Preview to NuGet
    if: contains(github.ref, '-preview')
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full Git history is required for correct GitVersion version calculation.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          configFilePath: GitVersion.yml

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      # Version from the tag: semVer (without +metadata, which NuGet does not accept).
      - name: Pack
        run: dotnet pack --configuration ${{ env.CONFIGURATION }} --no-build --no-restore /p:Version=${{ env.semVer }} --output artifacts

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --skip-duplicate --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  # Slim publish: build + pack + push for stable tags (vX.Y.Z).
  # Tests for this commit have already been run by CI on main.
  publish-stable:
    name: Publish Stable to NuGet
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-preview')
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full Git history is required for correct GitVersion version calculation.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          configFilePath: GitVersion.yml

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      # Version from the tag: semVer (without +metadata, which NuGet does not accept).
      - name: Pack
        run: dotnet pack --configuration ${{ env.CONFIGURATION }} --no-build --no-restore /p:Version=${{ env.semVer }} --output artifacts

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --skip-duplicate --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
